pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Needed for a few small UI libraries (Clans FAB, ImageZoom) that
        // are only published on JitPack, not Maven Central.
        maven { url 'https://jitpack.io' }
    }
}

rootProject.name = "Student Department"
include ':app'
